services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api-server
    restart: unless-stopped
    depends_on:
      db-push:
        condition: service_completed_successfully
    networks:
      - default
      - coolify
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to your Postgres connection string}
      PORT: "8080"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@graysparkmasjid.org.uk}
      LOCAL_STORAGE_DIR: /app/data/uploads
    volumes:
      - uploads-data:/app/data/uploads
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  db-push:
    build:
      context: .
      dockerfile: Dockerfile.api-server
      target: builder
    restart: "no"
    networks:
      - default
      - coolify
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to your Postgres connection string}
    working_dir: /app
    command:
      - sh
      - -c
      # Plain `push` (no --force): safe DDL applies automatically; destructive
      # statements abort the deploy instead of silently dropping production data.
      - "pnpm --filter @workspace/db run check-db && pnpm --filter @workspace/db run push"

  website:
    build:
      context: .
      dockerfile: Dockerfile.website
      args:
        BASE_PATH: /
    restart: unless-stopped
    depends_on:
      - api-server
    environment:
      PORT: "80"
    expose:
      - "80"

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - default
      - coolify
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to your Postgres connection string}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups-data:/backups
      - uploads-data:/uploads:ro
    command:
      - sh
      - -c
      - |
        while true; do
          ts=$$(date +%F-%H%M)
          echo "backup: starting $$ts"
          if pg_dump "$$DATABASE_URL" | gzip > "/backups/db-$$ts.sql.gz"; then
            echo "backup: db-$$ts.sql.gz written"
          else
            echo "backup: PG DUMP FAILED for $$ts" >&2
            rm -f "/backups/db-$$ts.sql.gz"
          fi
          tar -czf "/backups/uploads-$$ts.tar.gz" -C /uploads . 2>/dev/null || echo "backup: uploads tar failed" >&2
          find /backups -name '*.gz' -mtime +$$BACKUP_RETENTION_DAYS -delete
          sleep 86400
        done

volumes:
  uploads-data:
  backups-data:

networks:
  coolify:
    name: coolify
    external: true
